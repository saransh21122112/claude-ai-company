    - heading "An AI company you can actually trust with the keys" [level=1] [ref=f6e4]
    - paragraph [ref=f6e5]: "Foundry is a platform where an organization configures real autonomous AI department agents — engineering, product, research, operations, design, data, sales — that take real actions on your behalf: writing files, running code in a sandbox, sending outreach email, and more. Each department runs only as hot as you allow it."
    - heading "Guardrails first, not bolted on" [level=2] [ref=f6e6]
    - paragraph [ref=f6e7]:
      - text: "Every action any agent attempts passes through a single chokepoint before it runs. In order: an org-wide or per-department"
