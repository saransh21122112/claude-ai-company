- main [ref=e2]:
  - paragraph [ref=e3]: About
  - heading "An AI company you can actually trust with the keys" [level=1] [ref=e4]
  - paragraph [ref=e5]: "Foundry is a platform where an organization configures real autonomous AI department agents — engineering, product, research, operations, design, data, sales — that take real actions on your behalf: writing files, running code in a sandbox, sending outreach email, and more. Each department runs only as hot as you allow it."
  - heading "Guardrails first, not bolted on" [level=2] [ref=e6]
  - paragraph [ref=e7]:
    - text: "Every action any agent attempts passes through a single chokepoint before it runs. In order: an org-wide or per-department"
    - strong [ref=e8]: kill switch
    - text: that blocks everything instantly, whether the department is turned on at all, the
    - strong [ref=e9]: autonomy level
    - text: you've set for that department (off, drafts-only, or bounded-autonomous), hard-coded rules that always pause for your approval on anything irreversible, financial, or legal — no configuration can widen past that ceiling — a
    - strong [ref=e10]: budget cap
    - text: with automatic rollover, a
    - strong [ref=e11]: tool allowlist
    - text: ", and a rate limit. Every step, on every path — allowed, blocked, or paused for approval — is written to a full activity log, so nothing an agent attempts is invisible after the fact."
  - paragraph [ref=e12]: You also get per-tenant custom agent prompts, so a department agent acts the way your organization actually works, not a generic default.
  - heading "Early, and built in the open" [level=2] [ref=e13]
  - paragraph [ref=e14]: Foundry is early. There are no live paying customers yet, and we'd rather tell you that plainly than oversell it. What's here today — the guardrail pipeline, the kill switch, the activity log — is real and running, not a mockup. We're building it in the open and taking it seriously precisely because these agents take real actions.
